<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chicken Sarookh 2</title><link rel="stylesheet" href="/style.css"></head>
<body><div id="app">
<section id="menu" class="screen"><div class="heroChicken">🐔🚀</div><div class="version">BUILD 2.0 • CHAOS EDITION</div><h1>CHICKEN<br><span>SAROOKH 2</span></h1><p class="tag">DON'T GET ROCKETED.</p>
<div class="card menuCard"><input id="name" maxlength="16" placeholder="YOUR CHICKEN NAME"><div class="row"><button id="create" class="primary">CREATE ROOM</button><button id="showJoin">JOIN ROOM</button></div><div id="joinBox" class="hidden joinBox"><input id="room" maxlength="6" placeholder="ROOM CODE"><button id="join">JOIN</button></div><p id="error"></p></div>
<div class="help"><b>WASD / ARROWS</b> Move &nbsp; • &nbsp; <b>SPACE</b> Dash &nbsp; • &nbsp; <b>E</b> Kick</div></section>
<section id="lobby" class="screen hidden"><div class="topline"><span class="pill">LOBBY</span><span id="version2">CHICKEN SAROOKH 2</span></div><div class="card lobbyCard"><h2>ROOM <b id="roomCode"></b></h2><button id="copyCode" class="small">COPY CODE</button><div id="players"></div><p id="lobbyMsg"></p><button id="start" class="primary">START GAME</button><div class="controls">2–8 chickens • First to 3 round wins ends the match • total points decide final ranking</div></div></section>
<section id="game" class="hidden"><canvas id="canvas" width="1200" height="700"></canvas><div class="hud"><div><span id="round"></span><span id="alive"></span></div><div id="personal"></div></div><aside id="leaderboard"><div class="lbTitle">LEADERBOARD</div><div id="lbRows"></div></aside><div id="event"></div><div id="toast"></div><div id="cooldown">DASH READY</div><div id="powerStatus"></div><div id="countdown" class="hidden"></div><div id="overlay" class="hidden"></div></section>
<section id="results" class="screen hidden"><div class="resultsCard card"><div class="version">MATCH COMPLETE</div><h2>FINAL LEADERBOARD</h2><div id="podium"></div><div id="otherPlayers"></div><div class="row"><button id="playAgain" class="primary">PLAY AGAIN</button><button id="returnLobby">RETURN TO LOBBY</button></div></div></section>
</div><script src="/socket.io/socket.io.js"></script><script src="/game.js"></script></body></html>
